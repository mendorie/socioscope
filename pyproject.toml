[project]
name = "socioscope-workspace"
version = "0.0.0"
description = "Monorepo root for socioscope (public-data sociological analysis & causal inference)"
requires-python = ">=3.13"
# ルートは依存を持たない。実体は packages/core と themes/* の workspace member。
dependencies = []

[tool.uv]
package = false
# 推移的依存の下限制約（セキュリティ修正の取り込み漏れ・退行を lock 段階で防ぐ）。
# certifi: GHSA-6q48-6c7w-9gw2 — 鍵が侵害された eMudhra（emSign）中間 CA の親ルートを同梱していた。2026.10.19 で修正。
# pillow: CVE-2026-112390 ほか 24 件（matplotlib 経由の推移的依存）。13.0.0 で修正。
constraint-dependencies = ["certifi>=2026.10.19", "pillow>=13.0.0"]

[tool.uv.workspace]
members = ["packages/core", "themes/*"]

[tool.uv.sources]
socioscope-core = { workspace = true }

[dependency-groups]
dev = [
  "pytest>=8",
  "ruff>=0.8",
  "mypy>=1.13",
  "pyyaml>=6",
  "types-PyYAML",
  "socioscope-core",
  "theme-wealth-population-distribution",
  "theme-growth-fertility",
  "theme-bicycle-industry",
  "theme-parliament-size",
]
notebooks = ["marimo>=0.10", "matplotlib>=3.9", "plotly>=5"]

[tool.uv.sources.theme-wealth-population-distribution]
workspace = true
[tool.uv.sources.theme-growth-fertility]
workspace = true
[tool.uv.sources.theme-bicycle-industry]
workspace = true
[tool.uv.sources.theme-parliament-size]
workspace = true

# ---- 共通ツール設定（全 member に適用）----
[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["data", "notebooks", ".claude/skills/yomiyasu"]  # yomiyasu は上流（nanaism/yomiyasu）をそのまま vendoring

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "SIM", "RUF"]
ignore = ["S101", "RUF001", "RUF002", "RUF003"]  # assert in tests; 日本語の全角記号を許容

[tool.ruff.lint.isort]
known-first-party = ["socioscope_core", "theme_growth_fertility", "theme_wealth_population_distribution", "theme_bicycle_industry", "theme_parliament_size"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
mypy_path = ["packages/core/src", "themes/wealth-population-distribution/src", "themes/growth-fertility/src", "themes/bicycle-industry/src", "themes/parliament-size/src"]
namespace_packages = true
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["duckdb", "duckdb.*", "pyarrow", "pyarrow.*", "statsmodels", "statsmodels.*", "scipy", "scipy.*", "xlrd", "xlrd.*", "openpyxl", "openpyxl.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["packages/core/tests", "themes/*/tests"]
addopts = "-q --import-mode=importlib"
pythonpath = ["packages/core/src"]
