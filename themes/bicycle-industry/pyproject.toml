[project]
name = "theme-bicycle-industry"
version = "0.1.0"
description = "Theme: the bicycle industry in Japan and the world (segments, prices, e-bikes; contrast with cars and motorcycles)"
requires-python = ">=3.13"
dependencies = [
  "socioscope-core",
  "pydantic>=2.9",
  "polars>=1.0",
  "pyarrow>=17",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "pypdf>=6.21.1",  # CVE-2026-113786 ほか 5 件の修正版
]

[project.entry-points."socioscope.themes"]
bicycle-industry = "theme_bicycle_industry.wiring:PIPELINE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theme_bicycle_industry"]
