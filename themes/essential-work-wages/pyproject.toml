[project]
name = "theme-essential-work-wages"
version = "0.1.0"
description = "Theme: the essential-work paradox (why socially indispensable jobs pay the least; licensed and rent-proximate high earners as controls)"
requires-python = ">=3.13"
dependencies = [
  "socioscope-core",
  "pydantic>=2.9",
  "polars>=1.0",
  "pyarrow>=17",
  "statsmodels>=0.14",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "xlrd>=2.0",
  "pypdf>=6.21.1",  # CVE-2026-113786 ほか 5 件の修正版
]

[project.entry-points."socioscope.themes"]
essential-work-wages = "theme_essential_work_wages.wiring:PIPELINE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theme_essential_work_wages"]
