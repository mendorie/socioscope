[project]
name = "theme-parliament-size"
version = "0.1.0"
description = "Theme: is cutting the number of Diet members an appropriate policy? (per-capita ratios, role scope, PR seats, malapportionment, cost)"
requires-python = ">=3.13"
dependencies = [
  "socioscope-core",
  "pydantic>=2.9",
  "polars>=1.0",
  "pyarrow>=17",
  "matplotlib>=3.9",
]

[project.entry-points."socioscope.themes"]
parliament-size = "theme_parliament_size.wiring:PIPELINE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theme_parliament_size"]
