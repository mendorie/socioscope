[project]
name = "theme-public-debt"
version = "0.1.0"
description = "Theme: how has sovereign debt in capitalist states evolved since 1870, and which indicators support the 'end of capitalism' claim?"
requires-python = ">=3.13"
dependencies = [
  "socioscope-core",
  "pydantic>=2.9",
  "polars>=1.0",
  "pyarrow>=17",
  "matplotlib>=3.9",
  "openpyxl>=3.1",
  "pypdf>=6.21.1",
]

[project.entry-points."socioscope.themes"]
public-debt = "theme_public_debt.wiring:PIPELINE"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/theme_public_debt"]
